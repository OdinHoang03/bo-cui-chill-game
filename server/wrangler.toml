name = "bo-cui-chill-server"
main = "worker.js"
compatibility_date = "2024-09-23"

# Durable Object: mỗi phòng chơi là 1 instance của class Room
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Bắt buộc khai báo migration cho Durable Object mới.
# Gói MIỄN PHÍ yêu cầu Durable Object nền SQLite → dùng new_sqlite_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
